openapi: 3.0.3
info:
  title: Personal Task List API
  version: 1.0.0
  description: Minimal REST API for managing a personal task list.
servers:
  - url: http://localhost:5269
    description: Local development server
tags:
  - name: Tasks
    description: Personal task list operations
paths:
  /api/tasks:
    get:
      tags:
        - Tasks
      summary: View the task list
      operationId: listTasks
      responses:
        "200":
          description: Task list returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      tags:
        - Tasks
      summary: Create a task
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created successfully.
          headers:
            Location:
              description: URL for the task collection because individual task lookup is not part of version 1.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/tasks/{id}:
    put:
      tags:
        - Tasks
      summary: Edit a task
      operationId: updateTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Tasks
      summary: Delete a task
      operationId: deleteTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Task deleted successfully.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/tasks/{id}/complete:
    patch:
      tags:
        - Tasks
      summary: Mark a task as completed
      operationId: completeTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task marked as completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Unique task identifier.
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Request body or path value is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationProblem"
    NotFound:
      description: Task was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - isCompleted
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique task identifier generated by the API.
        title:
          type: string
          minLength: 1
          description: Required task title.
        description:
          type: string
          nullable: true
          description: Optional task details.
        isCompleted:
          type: boolean
          default: false
          description: Indicates whether the task has been completed.
        createdAt:
          type: string
          format: date-time
          description: Timestamp set when the task is created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp set when the task is created or changed.
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp set when the task is completed.
    CreateTaskRequest:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          description: Required task title.
        description:
          type: string
          nullable: true
          description: Optional task details.
    UpdateTaskRequest:
      type: object
      required:
        - title
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          description: Required task title.
        description:
          type: string
          nullable: true
          description: Optional task details.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
    ValidationProblem:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
